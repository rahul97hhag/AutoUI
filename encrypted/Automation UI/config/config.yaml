base_url: "https://automationexercise.com"
browser: "chromium"   # chromium | firefox | webkit
headless: false
slow_mo: 0
timeout: 30000
viewport:
  width: 1280
  height: 720

# Per-step Allure observability (features/environment.py before_step/after_step).
# Screenshots + network traces on every step are heavy; turn off for fast local runs.
capture_step_screenshots: true
capture_network: true
