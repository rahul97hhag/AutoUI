# Central locator registry for the generic step library (features/steps/generic_steps.py).
#
# Each top-level key is a "page" name used in step text, e.g. "the {page} page".
# Each entry under a page maps a human-readable element alias to a Playwright selector.
# A selector may contain:
#   {value}  - substituted with the dynamic value passed by the step (text-based lookup)
#   {index}  - substituted with a zero-based index resolved from an ordinal ("first", "second", ...)
# Selectors without a placeholder are static and ignore any value passed to them.

_pages:
  home: "/"
  login: "/login"
  products: "/products"
  cart: "/view_cart"
  contact us: "/contact_us"
  test cases: "/test_cases"
  # Telecom recharge app (separate Angular project, see app.routes.ts) --
  # absolute URLs, so they're used as-is regardless of config.yaml's
  # base_url (automationexercise.com). Adjust host/port if it's not served
  # by the default `ng serve` address.
  recharge: "http://localhost:4200/recharge"
  recharge packs: "http://localhost:4200/recharge-packs"

home:
  test cases link: "#header a[href='/test_cases']"
  products link: "a[href='/products']"
  cart link: "a[href='/view_cart']"
  signup login link: "a[href='/login']"
  logout link: "a[href='/logout']"
  delete account link: "a[href='/delete_account']"
  logged in as label: "a:has-text('Logged in as {value}')"
  hero heading: "h2:has-text('Full-Fledged practice website for Automation Engineers') >> nth=0"
  scroll up button: "#scrollUp"
  category sidebar: "#accordian"
  category toggle: "a[href='#{value}']"
  category item: ".panel-collapse.in ul li a:has-text('{value}')"
  subscription heading: ".single-widget h2:has-text('Subscription')"
  subscribe email field: "#susbscribe_email"
  subscribe button: "#subscribe"
  subscribe success message: "#success-subscribe .alert-success"

login:
  login email field: "input[data-qa='login-email']"
  login password field: "input[data-qa='login-password']"
  login button: "button[data-qa='login-button']"
  login error message: "p:has-text('incorrect')"
  signup name field: "input[data-qa='signup-name']"
  signup email field: "input[data-qa='signup-email']"
  signup button: "button[data-qa='signup-button']"
  signup error message: "p:has-text('already exist')"

account:
  title mr radio: "#id_gender1"
  password field: "#password"
  days dropdown: "#days"
  months dropdown: "#months"
  years dropdown: "#years"
  first name field: "#first_name"
  last name field: "#last_name"
  address field: "#address1"
  country dropdown: "#country"
  state field: "#state"
  city field: "#city"
  zipcode field: "#zipcode"
  mobile number field: "#mobile_number"
  newsletter checkbox: "#newsletter"
  special offers checkbox: "#optin"
  create account button: "button[data-qa='create-account']"
  account created heading: "h2[data-qa='account-created']"
  continue button: "a[data-qa='continue-button']"
  account deleted heading: "h2[data-qa='account-deleted']"

products:
  search field: "#search_product"
  search button: "#submit_search"
  results title: "h2.title.text-center"
  product card: ".product-image-wrapper:has-text('{value}')"
  product card by position: ".product-image-wrapper >> nth={index}"
  add to cart link: ".product-image-wrapper:has-text('{value}') >> a:has-text('Add to cart')"
  add to cart link by position: ".product-image-wrapper >> nth={index} >> a:has-text('Add to cart')"
  view product link: ".product-image-wrapper:has-text('{value}') >> a:has-text('View Product')"
  view product link by position: ".product-image-wrapper >> nth={index} >> a:has-text('View Product')"
  continue shopping button: "button:has-text('Continue Shopping')"
  view cart modal link: "#cartModal a[href='/view_cart']"
  brands sidebar: ".brands_products"
  brand link: ".brands-name ul li a:has-text('{value}')"

cart:
  cart row: "#cart_info tbody tr:has-text('{value}')"
  cart row remove button: "#cart_info tbody tr:has-text('{value}') .cart_quantity_delete"
  proceed to checkout button: "a.check_out"
  subscription heading: ".single-widget h2:has-text('Subscription')"
  subscribe email field: "#susbscribe_email"
  subscribe button: "#subscribe"
  subscribe success message: "#success-subscribe .alert-success"

checkout:
  comment field: "textarea[name='message']"
  place order button: "a.check_out"

payment:
  name on card field: "input[data-qa='name-on-card']"
  card number field: "input[data-qa='card-number']"
  cvc field: "input[data-qa='cvc']"
  expiry month field: "input[data-qa='expiry-month']"
  expiry year field: "input[data-qa='expiry-year']"
  pay button: "button[data-qa='pay-button']"
  order success message: "p:has-text('order has been confirmed')"

contact us:
  name field: "input[data-qa='name']"
  email field: "input[data-qa='email']"
  subject field: "input[data-qa='subject']"
  message field: "textarea[data-qa='message']"
  upload field: "input[name='upload_file']"
  submit button: "input[data-qa='submit-button']"
  success message: ".status.alert-success"
  home button: "#form-section .btn-success"

test cases:
  page title: "h2.title.text-center"

product detail:
  product name: ".product-information h2"
  category text: ".product-information p:has-text('Category')"
  price text: ".product-information span span"
  availability text: ".product-information p:has-text('Availability')"
  condition text: ".product-information p:has-text('Condition')"
  brand text: ".product-information p:has-text('Brand')"
  quantity field: "#quantity"
  add to cart button: "button.cart"
  review name field: "#review-form #name"
  review email field: "#review-form #email"
  review text field: "#review-form #review"
  review submit button: "#button-review"
  review success message: "#review-section .alert-success"

listing:
  page title: "h2.title.text-center"

# --- Telecom recharge app (separate Angular project) -------------------
# Element locators for its "recharge" / "recharge packs" / "recharge
# payment" pages come from config/locators_2.yaml (auto-generated by
# locator_agent.py from the app's own Angular templates, merged in by
# config/locators.py). Only page URLs live here, since the agent doesn't
# generate those.
